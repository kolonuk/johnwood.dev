# Builds the Astro resume site into a static image and pushes it to the
# GitHub Container Registry. This workflow does NOT deploy — the image is
# pulled and run by the dadock compose stack on the home server.
#
# No repository secrets are required: GHCR is authenticated with the
# per-run GITHUB_TOKEN via the `packages: write` permission below.

name: Build and Push Resume Site Docker Image

on:
  workflow_dispatch: {}
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'php/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
      - 'tsconfig.json'
      - 'Dockerfile'
      - 'nginx.conf'
      - '.github/workflows/docker-build-push.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: 'read'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/johnwood.dev

jobs:
  lint-php:
    name: Lint PHP
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Syntax check (php -l)
        run: find php -name "*.php" -exec php -l {} \;

  lint-dockerfile:
    name: Lint Dockerfile
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  trivy-fs:
    name: Scan source for vulnerabilities (Trivy FS)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  build:
    name: Build, Scan and Push Image
    needs: [lint-php, lint-dockerfile, trivy-fs]
    runs-on: ubuntu-24.04
    permissions:
      contents: 'read'
      packages: 'write'
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      # dadock's reconciler pins the immutable main-<sha12> tag; there is no
      # :latest or rolling tag.
      - name: Compute image tags
        id: meta
        run: |
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-12)"
          IMAGE_BASE="${REGISTRY}/${IMAGE_NAME}"
          echo "short_sha=${SHORT_SHA}"                      >> "$GITHUB_OUTPUT"
          echo "image_base=${IMAGE_BASE}"                    >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_BASE}:main-${SHORT_SHA}"   >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Build locally first so it can be scanned before anything is pushed —
      # a failed scan must never leave a vulnerable image in GHCR.
      - name: Build (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.image_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 18080:8080 "${{ steps.meta.outputs.image_ref }}"
          for i in $(seq 1 10); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/ || true)"
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "$code" = "200" ] || { echo "site did not return 200 (got $code)"; docker logs smoke; exit 1; }
          curl -sf http://localhost:18080/resume/ > /dev/null
          curl -sf -o /dev/null -w '%{content_type}\n' http://localhost:18080/resume.pdf | grep -q application/pdf
          # No SMTP_USER set in this job, so contact.php can't send mail, but
          # it should still be reachable and reject a GET.
          contact_code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/contact.php)"
          [ "$contact_code" = "405" ] || { echo "contact.php GET did not 405 (got $contact_code)"; docker logs smoke; exit 1; }
          docker rm -f smoke

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ steps.meta.outputs.image_ref }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_ref }}
          cache-from: type=gha

      - name: Summary
        run: |
          echo "Pushed \`${{ steps.meta.outputs.image_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
