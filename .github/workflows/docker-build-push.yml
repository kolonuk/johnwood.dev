# Builds src/ (the PHP resume site) into a Docker image and pushes it to the
# GitHub Container Registry. This workflow does NOT deploy — the image is
# pulled and run by the dadock compose stack on the home server.
#
# No repository secrets are required: GHCR is authenticated with the
# per-run GITHUB_TOKEN via the `packages: write` permission below.
#
# One-time setup: after the first successful push, make the package public at
#   https://github.com/users/kolonuk/packages/container/johnwood.dev/settings
# so dadock can pull it without a registry login.

name: Build and Push Resume Site Docker Image

on:
  workflow_dispatch: {}
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - '.github/workflows/docker-build-push.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: 'read'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/johnwood.dev

jobs:
  lint-php:
    name: Lint PHP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      # Syntax only. index.php is an HTML page with PHP islands, not a PHP
      # source file, so PSR12 does not meaningfully apply to it — phpcs
      # reported 145 violations (indentation, line length) that would mean
      # reformatting a working page to satisfy a standard aimed at
      # class/function files. Dropped rather than suppressed per-line.
      - name: Syntax check (php -l)
        run: find src -name "*.php" -exec php -l {} \;

  lint-dockerfile:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: src/Dockerfile
          # DL3008 (pin apt versions): deliberately not pinned. The image is
          # rebuilt against php:8.2-apache, and pinned Debian point versions
          # disappear from the archive on the next base update, which would
          # break the build rather than make it reproducible.
          ignore: DL3008

  trivy-fs:
    name: Scan source for vulnerabilities (Trivy FS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: 'src'
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  build:
    name: Build and Push Image
    needs: [lint-php, lint-dockerfile, trivy-fs]
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      packages: 'write'
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # dadock pins images by an immutable prod-<short sha> tag (same
      # convention as the daclusta-docs image), with :latest as a convenience.
      - name: Compute image tags
        id: meta
        run: |
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-12)"
          IMAGE_BASE="${REGISTRY}/${IMAGE_NAME}"
          echo "short_sha=${SHORT_SHA}"                      >> "$GITHUB_OUTPUT"
          echo "image_base=${IMAGE_BASE}"                    >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_BASE}:prod-${SHORT_SHA}"   >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_ref }}
            ${{ steps.meta.outputs.image_base }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Pushed \`${{ steps.meta.outputs.image_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Update dadock \`docker-compose.yml\` to pin this tag." >> "$GITHUB_STEP_SUMMARY"

  trivy-image-scan:
    name: Scan image for vulnerabilities (Trivy Image)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      packages: 'read'
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ needs.build.outputs.image_ref }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  cleanup-images:
    name: Clean up old container images
    needs: [build, trivy-image-scan]
    runs-on: ubuntu-latest
    permissions:
      packages: 'write'
    steps:
      - name: Delete all but the 5 most recent versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'johnwood.dev'
          package-type: 'container'
          min-versions-to-keep: 5
          # :latest moves with every build, so the newest version always
          # carries it and is inside the keep window above.
          ignore-versions-with-tags: 'latest'
