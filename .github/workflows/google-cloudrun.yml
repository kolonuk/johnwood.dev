name: Build and Deploy to Google Cloud

on:
  push:
    branches: [ "main" ]

env:
  PROJECT_ID: johnwood #YOUR_PROJECT_ID # TODO: update Google Cloud project id
  #GAR_LOCATION: europe-west1 #YOUR_GAR_LOCATION # TODO: update Artifact Registry location
  SERVICE: johnwood #YOUR_SERVICE_NAME # TODO: update Cloud Run service name
  REGION: europe-west1 #YOUR_SERVICE_REGION # TODO: update Cloud Run service region
  DEBUG: 'false'

jobs:
  deploy:
    # Add 'id-token' with the intended permissions for workload identity federation
    permissions:
      contents: 'read'
      id-token: 'write'

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: env.DEBUG == 'false'
        uses: actions/checkout@v4

      - name: Google Auth
        if: env.DEBUG == 'false'
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          token_format: 'access_token'
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}' # e.g. - projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}' # e.g. - my-service-account@my-project.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        if: env.DEBUG == 'false'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy to App Engine
        if: env.DEBUG == 'false'
        run: |
          gcloud app deploy --quiet || { echo "Deployment failed"; gcloud app deploy --verbosity=debug; exit 1; }

      - name: Get Deployed URL
        if: env.DEBUG == 'false'
        run: |
          DEPLOYED_URL=$(gcloud app browse --no-launch-browser --format="value(defaultHostname)")
          echo "The application has been deployed. You can access it at: https://${DEPLOYED_URL}"