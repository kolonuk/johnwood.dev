name: Build and Deploy to Google Cloud

on:
  push:
    branches: [ "main" ]

env:
  PROJECT_ID: johnwood
  SERVICE: johnwood
  REGION: europe-west1
  DOMAIN: johnwood.dev

jobs:
  deploy:
    permissions:
      contents: 'read'
      id-token: 'write'

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Lint PHP files
        run: find . -name "*.php" -not -path "*/vendor/*" -exec php -l {} \;

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          token_format: 'access_token'
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy to App Engine
        id: deploy
        run: |
          gcloud app deploy --quiet

      - name: Get Deployed URL
        id: get_url
        run: |
          URL=$(gcloud app versions describe $(gcloud app versions list --service=${{ env.SERVICE }} --sort-by="~version.createTime" --limit=1 --format="value(version.id)") --service=${{ env.SERVICE }} --format="value(version.versionUrl)")
          echo "deployed_url=${URL}" >> $GITHUB_OUTPUT

      - name: Health Check
        run: |
          curl -s --fail ${{ steps.get_url.outputs.deployed_url }}

      - name: Verify Domain Mapping
        run: |
          MAPPING=$(gcloud app domain-mappings describe ${{ env.DOMAIN }} --format="value(sslSettings.certificateManagementMode)")
          if [ "$MAPPING" != "AUTOMATIC" ]; then
            echo "Domain '${{ env.DOMAIN }}' is not mapped correctly or does not have automatic SSL."
            echo "Please follow these steps to configure the custom domain:"
            echo "1. Verify ownership of '${{ env.DOMAIN }}' in the Google Cloud Console."
            echo "2. In the App Engine settings, go to 'Custom Domains' and add '${{ env.DOMAIN }}'."
            echo "3. Follow the instructions to update your domain's DNS records."
            exit 1
          fi
          echo "Domain '${{ env.DOMAIN }}' is mapped correctly with automatic SSL."
